<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MalalphAI comic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Bagel+Fat+One&family=Comic+Neue:wght@700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root { --ink: #1b1b1d; --paper: #fffdf6; --red: #e73427; --blue: #1d539f; --yellow: #f8b92a; --nimble: #0b8a73; --gem: #6f6bd8; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
.frame { position: absolute; inset: 24px; background: var(--paper); border: 10px solid var(--ink); overflow: hidden;
  background-image: radial-gradient(rgb(0 0 0 / .09) 2.2px, transparent 2.6px); background-size: 18px 18px; }
.cap { position: absolute; background: var(--yellow); border: 6px solid var(--ink); padding: 14px 26px; font-family: "Bangers", Impact, sans-serif; font-size: 54px; letter-spacing: .03em; box-shadow: 10px 10px 0 var(--ink); z-index: 5; }
.bub { position: absolute; background: #fff; border: 6px solid var(--ink); border-radius: 46px; padding: 22px 32px; font-family: "Comic Neue", "Comic Sans MS", sans-serif; font-weight: 700; font-size: 40px; line-height: 1.2; box-shadow: 8px 8px 0 var(--ink); max-width: 760px; z-index: 4; }
.bub small { display: block; font-family: "IBM Plex Mono", monospace; font-size: 22px; color: #666; margin-top: 8px; }
.bub::after { content: ""; position: absolute; width: 46px; height: 46px; background: #fff; border-right: 6px solid var(--ink); border-bottom: 6px solid var(--ink); bottom: -27px; left: 70px; transform: rotate(45deg) skew(12deg, 12deg); }
.bub.think { border-radius: 60px; }
.bub.think::after { width: 34px; height: 34px; border-radius: 50%; border: 6px solid var(--ink); transform: none; bottom: -52px; left: 120px; }
.big { font-family: "Bangers", Impact, sans-serif; letter-spacing: .03em; }
.burst { position: absolute; display: grid; place-items: center; font-family: "Bangers", Impact, sans-serif; color: #fff; -webkit-text-stroke: 3px var(--ink); z-index: 6;
  clip-path: polygon(50% 0%, 61% 25%, 88% 12%, 78% 39%, 100% 50%, 78% 61%, 88% 88%, 61% 75%, 50% 100%, 39% 75%, 12% 88%, 22% 61%, 0% 50%, 22% 39%, 12% 12%, 39% 25%); }
.emoji { position: absolute; font-size: 300px; line-height: 1; z-index: 3; }
.card { position: absolute; background: #fff; border: 6px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); padding: 22px 28px; font-family: "Comic Neue", sans-serif; font-weight: 700; font-size: 36px; z-index: 4; }
.stamp { position: absolute; font-family: "Bangers", Impact, sans-serif; font-size: 68px; padding: 2px 20px; border: 7px solid currentColor; border-radius: 10px; transform: rotate(-12deg); z-index: 7; background: rgb(255 255 255 / .85); }
.logo { font-family: "Bagel Fat One", sans-serif; color: var(--red); }
.logo span { color: var(--ink); }
.bars { display: grid; grid-template-columns: 90px 520px; gap: 12px 16px; align-items: center; font-family: "IBM Plex Mono", monospace; font-size: 28px; }
.bar { display: flex; height: 34px; border: 4px solid var(--ink); }
.bar i { display: block; height: 100%; }
.shot { position: absolute; border: 8px solid var(--ink); box-shadow: 14px 14px 0 var(--ink); background: #fff; overflow: hidden; z-index: 3; }
.shot img { display: block; width: 100%; }
.pill { display: inline-flex; align-items: center; gap: 14px; background: #fff; border: 5px solid var(--ink); border-radius: 999px; padding: 10px 26px; font-family: "Comic Neue", sans-serif; font-weight: 700; font-size: 34px; box-shadow: 6px 6px 0 var(--ink); }
.chain { position: absolute; left: 90px; right: 90px; top: 380px; display: flex; align-items: center; justify-content: space-between; z-index: 4; }
.chain .card { position: static; font-family: "Bangers", sans-serif; font-size: 64px; letter-spacing: .03em; padding: 18px 30px; }
.chain .arr { font-family: "Bangers", sans-serif; font-size: 90px; }
.wall { position: absolute; left: 820px; top: 200px; width: 260px; height: 640px; z-index: 2;
  background: repeating-linear-gradient(0deg, transparent 0 66px, var(--ink) 66px 72px), repeating-linear-gradient(90deg, #c0533a 0 124px, var(--ink) 124px 130px); border: 8px solid var(--ink); }
.wall::after { content: "BOT WALL"; position: absolute; top: 40%; left: -40px; right: -40px; text-align: center; font-family: "Bangers", sans-serif; font-size: 60px; color: #fff; -webkit-text-stroke: 3px var(--ink); transform: rotate(-90deg); }
.hidden { visibility: hidden; }
.capbar { position: absolute; left: 24px; right: 24px; top: 966px; padding: 14px 20px 10px; background: var(--ink); text-align: center; z-index: 20; white-space: nowrap;
  font-family: "Bangers", Impact, sans-serif; font-size: 58px; letter-spacing: .03em; line-height: 1; color: #fff; }
.capbar b { color: var(--yellow); }
</style>
</head>
<body>
<div class="frame" id="f"></div>
<script>
const q = new URLSearchParams(location.search);
const scene = +q.get("scene") || 1, step = q.has("step") ? +q.get("step") : 99;
const L = "../assets/logos/";
const NIM = h => `<img src="${L}nimble.svg" style="height:${h}px;vertical-align:middle" alt="Nimble">`;
const GEM = h => `<img src="${L}gemini_word.svg" style="height:${h}px;vertical-align:middle" alt="Gemini">`;
const S = n => step >= n ? "" : "hidden";
const bars = rows => `<div class="bars">${rows.map(([h, p]) => `<span>${h}</span><div class="bar"><i style="width:${p[0]}%;background:var(--blue)"></i><i style="width:${p[1]}%;background:#c9c9d4"></i><i style="width:${p[2]}%;background:var(--red)"></i></div>`).join("")}</div>`;

const scenes = {
  1: `
    <div class="burst" style="left:1260px;top:90px;width:420px;height:420px;background:var(--red);font-size:80px;transform:rotate(10deg)">HOT!</div>
    <div style="position:absolute;left:150px;top:250px;z-index:4">
      <div class="logo" style="font-size:250px;line-height:.9">Malalph<span>AI</span></div>
      <div class="big" style="font-size:96px;margin-top:20px">Turning talk into direction.</div>
      <div style="margin-top:50px;display:flex;gap:30px;align-items:center"><span class="pill">starring ${NIM(40)}</span><span class="pill">and ${GEM(64)}</span></div>
    </div>
    <div class="emoji" style="left:1420px;top:620px;font-size:260px">🌶️</div>`,
  2: `
    <div class="cap" style="left:50px;top:40px">Monday. 9:02 AM. Somewhere in New York…</div>
    <div class="emoji" style="left:260px;top:430px;font-size:380px">🧑‍💻</div>
    <div class="card" style="left:960px;top:250px;width:820px;height:560px;padding:0;overflow:hidden">
      <div style="background:#2d4a7a;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:30px;padding:14px 24px">forexfactory.com/news</div>
      <div style="padding:26px;font-size:34px;line-height:1.5">
        <b>Trump: Effective immediately, there is an energy ceasefire…</b><br>
        <span style="color:#777">💬 18 comments · 🔥 hot</span><br><br>
        <span style="color:#999">The Fool · Momofrmnyc · eqshack · Trader#3861 · Vancarbon · leila9 · …</span>
      </div>
    </div>
    <div class="bub think" style="left:120px;top:150px">Okay, internet…<br>what's the dollar doing?</div>`,
  3: `
    <div class="emoji" style="left:780px;top:400px;font-size:340px">😵‍💫</div>
    <div class="bub" style="left:60px;top:60px;transform:rotate(-4deg)">“Sell usd”<small>eqshack · 1 hr 46 min ago</small></div>
    <div class="bub" style="left:560px;top:40px;transform:rotate(3deg)">“Aka gold up”<small>eqshack</small></div>
    <div class="bub" style="left:1100px;top:70px;transform:rotate(-2deg)">“yea i see orange”<small>xfpw</small></div>
    <div class="bub" style="left:1480px;top:300px;transform:rotate(5deg)">“Fake!”<small>Mhdeldar</small></div>
    <div class="bub" style="left:60px;top:330px;transform:rotate(3deg)">“But energy deal is done in USD”<small>Trader#3861</small></div>
    <div class="bub" style="left:1250px;top:560px;transform:rotate(-5deg)">“Gold SELL?”<small>martynaciesl</small></div>
    <div class="bub ${S(2)}" style="left:40px;top:640px;max-width:700px;transform:rotate(-2deg)">“Oil down - inflation down - no rate hike - dollar down - stocks up.”<small>eqshack · 5 min ago</small></div>
    <div class="burst ${S(2)}" style="left:1140px;top:760px;width:640px;height:270px;background:var(--red);font-size:62px">WHO DO I TRUST?!</div>
    <div class="cap ${S(3)}" style="left:40px;top:930px;font-size:52px">18 comments · 2 real calls · 0 track records</div>`,
  4: `
    <div class="cap" style="left:50px;top:40px">Step 1: send ${NIM(44)} shopping</div>
    <div class="wall"></div>
    <div class="emoji" style="left:${step >= 2 ? 1180 : 360}px;top:420px;font-size:300px;transform:scaleX(-1)">🛒</div>
    <div class="pill" style="position:absolute;left:${step >= 2 ? 1150 : 330}px;top:330px;z-index:4">${NIM(36)} vx10 stealth</div>
    <div class="burst ${S(2)}" style="left:700px;top:330px;width:520px;height:420px;background:var(--nimble);font-size:110px">BAM!</div>
    <div class="card ${S(2)}" style="left:1060px;top:640px;width:780px;font-size:40px;line-height:1.5">✅ Cloudflare: passed<br>⏱ 5.6 seconds<br>📄 markdown with author, time, permalink</div>`,
  5: `
    <div class="cap" style="left:50px;top:40px">Step 2: ${GEM(70)} tastes every comment</div>
    <div class="emoji" style="left:80px;top:600px;font-size:300px">👩‍🍳</div>
    <div class="card" style="left:520px;top:220px;width:600px;transform:rotate(-2deg)">“yea i see orange”<div style="font-size:24px;color:#777;margin-top:6px">xfpw</div></div>
    <div class="stamp ${S(1)}" style="left:850px;top:230px;color:#888">SKIP: JOKE</div>
    <div class="card" style="left:1200px;top:200px;width:620px;transform:rotate(2deg)">“Zelensky should just say thank you…”<div style="font-size:24px;color:#777;margin-top:6px">Polimini</div></div>
    <div class="stamp ${S(2)}" style="left:1450px;top:250px;color:#888">SKIP: POLITICS</div>
    <div class="card ${S(3)}" style="left:520px;top:520px;width:1300px;border-color:var(--gem);box-shadow:10px 10px 0 var(--gem)">
      “Sell usd … Oil down - inflation down - no rate hike - dollar down - stocks up.” <span style="font-size:26px;color:#777">eqshack</span>
      <div style="display:flex;gap:40px;align-items:center;margin-top:18px">${bars([["5d", [45, 45, 10]], ["22d", [40, 45, 15]], ["66d", [35, 50, 15]]])}
      <div style="font-family:'IBM Plex Mono',monospace;font-size:26px;line-height:1.5">pairs: EUR · JPY · GBP · CAD<br><span style="color:var(--blue)">■ USD down</span> <span style="color:#999">■ sideways</span> <span style="color:var(--red)">■ up</span></div></div>
    </div>
    <div class="stamp ${S(3)}" style="left:1440px;top:415px;color:var(--nimble);transform:rotate(-6deg)">CALL ✓ USD ↓</div>`,
  6: `
    <div class="cap" style="left:50px;top:40px">Not just WHAT the crowd thinks. WHY.</div>
    <div class="chain">
      <div class="card">🛢️ Oil ↓</div><span class="arr">→</span>
      <div class="card">📉 Inflation ↓</div><span class="arr">→</span>
      <div class="card">🏦 No hike</div><span class="arr">→</span>
      <div class="card" style="background:var(--blue);color:#fff">💵 USD ↓</div>
    </div>
    <div class="bub" style="left:120px;top:700px;max-width:1100px">Gemini keeps the reason with every call, so you can argue with the logic, not just the vibe.<small>Gemini’s reason, verbatim: “Expects lower oil and inflation to prevent rate hikes and push the dollar down.”</small></div>
    <div class="pill" style="position:absolute;right:80px;bottom:80px;z-index:4">interpreted by ${GEM(60)}</div>`,
  7: `
    <div class="cap" style="left:50px;top:40px">Step 3: everything goes into the pot</div>
    <div class="shot" style="left:120px;top:170px;width:1680px;transform:rotate(-0.6deg)"><img src="out/shot_pot.png" alt=""></div>
    <div class="burst" style="left:1500px;top:760px;width:380px;height:280px;background:var(--red);font-size:54px">BAYES!</div>`,
  8: `
    <div class="cap" style="left:50px;top:40px">${GEM(70)}'s judgment, quantified</div>
    <div class="shot" style="left:160px;top:190px;width:1600px;transform:rotate(0.5deg)"><img src="out/shot_pulse.png" alt=""></div>`,
  9: `
    <div class="cap" style="left:50px;top:40px">Every number comes with a receipt</div>
    <div class="shot" style="left:60px;top:170px;width:${step >= 2 ? 600 : 1000}px;transform:rotate(-1.5deg)"><img src="out/shot_thread.png" alt=""></div>
    <div class="shot ${S(2)}" style="left:${step >= 3 ? 560 : 700}px;top:200px;width:${step >= 3 ? 640 : 1000}px;transform:rotate(1deg)"><img src="out/shot_trace.png" alt=""></div>
    <div class="shot ${S(3)}" style="left:1180px;top:240px;width:680px;transform:rotate(2deg)"><img src="out/shot_lineage.png" alt=""></div>
    <div class="bub ${S(3)}" style="left:1180px;top:840px;max-width:640px;font-size:34px">Thread · Trace · Lineage · Raw JSON 🤓</div>`,
  10: `
    <div class="cap" style="left:50px;top:40px">It's a hot pot. YOU season it.</div>
    <div class="shot" style="left:50px;top:200px;width:880px;transform:rotate(-1deg)"><img src="out/shot_default.png" alt=""></div>
    <div class="shot ${S(2)}" style="left:965px;top:220px;width:880px;transform:rotate(1deg)"><img src="out/shot_mine.png" alt=""></div>
    <div class="pill" style="position:absolute;left:300px;top:900px;z-index:5">Default pot</div>
    <div class="pill ${S(2)}" style="position:absolute;left:1100px;top:900px;z-index:5">My pot: mute eqshack, back a chef → Δ</div>`,
  11: `
    <div class="cap" style="left:50px;top:40px">A word from the AI that helped cook this</div>
    <div class="emoji" style="left:110px;top:330px;font-size:300px">🤖</div>
    <div class="bub" style="left:560px;top:190px;max-width:1240px;font-size:44px;line-height:1.45">
      🏆 A public leaderboard of who <i>really</i> knows the dollar<br>
      <span class="${S(2)}">🌏 Every forum, every language: Tokyo, London, Toronto<br>
      🛢️ Then oil, gold and rates, same recipe<br>
      🔍 A sentiment desk that shows its work</span>
      <small>Claude · AI pair-programmer on this project</small>
    </div>`,
  12: `
    <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:4">
      <div>
        <div class="logo" style="font-size:220px;line-height:.9">Malalph<span>AI</span></div>
        <div class="big" style="font-size:90px;margin:18px 0 44px">Turning talk into direction.</div>
        <div style="display:flex;gap:30px;justify-content:center"><span class="pill">Extracted by ${NIM(40)}</span><span class="pill">Interpreted by ${GEM(64)}</span></div>
        <div style="margin-top:44px;font-family:'IBM Plex Mono',monospace;font-size:40px">zhanghaoquan.github.io/malalphai</div>
        <div style="margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:30px;color:#666">AI Engineer NYC 2026 · MLH</div>
      </div>
    </div>`,
};
document.getElementById("f").innerHTML = scenes[scene];
if (q.get("cap")) document.body.insertAdjacentHTML("beforeend", `<div class="capbar">${q.get("cap").replace(/\*([^*]+)\*/g, "<b>$1</b>")}</div>`);
</script>
</body>
</html>
